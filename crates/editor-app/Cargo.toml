[package]
name = "editor-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rcam-diagnostics.workspace = true
editor-core.workspace = true
editor-service.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
serde.workspace = true
rcam-project.workspace = true

[dev-dependencies]
gerber-io.workspace = true

[[example]]
name = "s0-demo"
path = "src/s0_demo.rs"
test = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

objc2-core-text = { version = "=0.3.2", default-features = false, features = ["std", "CTFontCollection", "CTFontDescriptor"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString", "CFURL"] }
