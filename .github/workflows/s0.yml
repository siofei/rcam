name: S0 validation

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-msvc
          - os: macos-15
            name: macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Select pinned Rust
        run: rustup override set 1.89.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Audit service dependency tree
        run: cargo tree --locked -p editor-service --edges normal
      - name: Automation contract
        run: cargo test --locked -p editor-service --test automation_contract
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p editor-app
